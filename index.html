<!DOCTYPE html>
<html>
<head>
  <title>Peta Persebaran Kafe Kota Yogyakarta</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style type="text/css">
    body { margin: 0; padding: 0; }
    html, body, #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  // Inisialisasi peta tepat di pusat Kota Yogyakarta
  var map = L.map('map').setView([-7.7956, 110.3695], 12);

  // Basemap dari folder XYZ tiles lokal yang sudah di-push ke GitHub
  // Catatan: Jika tile di foldermu berekstensi .png, ganti .jpg menjadi .png
  L.tileLayer('{z}/{x}/{y}.jpg', {
    minZoom: 12,
    maxZoom: 13,
    tms: false,
    attribution: 'Peta &copy; QGIS'
  }).addTo(map);

  // Data 10 kafe yang sudah diperbaiki koordinatnya
  var cafeData = [
    { nama: "Loko Cafe", lat: -7.78952008879687, lon: 110.366011980225 },
    { nama: "Bolo Space", lat: -7.78847664162327, lon: 110.372405729565 },
    { nama: "The Martani Café", lat: -7.79037817840534, lon: 110.381263787931 },
    { nama: "Kopi Pakpos", lat: -7.80139717053481, lon: 110.365270071448 },
    { nama: "Dummin Coffe", lat: -7.78580815246585, lon: 110.378788472258 },
    { nama: "Silol Kopi", lat: -7.78409493996592, lon: 110.374225439411 },
    { nama: "Nook Coffe", lat: -7.79692006887933, lon: 110.379893206528 },
    { nama: "Piyama Coffe", lat: -7.78272284830959, lon: 110.362762991162 },
    { nama: "Kakofoni Coffe", lat: -7.79993591190922, lon: 110.387556351054 },
    { nama: "Toko Kopi Tuku", lat: -7.78529926167569, lon: 110.373846254021 }
  ];

  // Render pin marker ke peta beserta popup nama kafe
  cafeData.forEach(function(item) {
    L.marker([item.lat, item.lon])
      .addTo(map)
      .bindPopup("<b>" + item.nama + "</b>");
  });
</script>
</body>
</html>
